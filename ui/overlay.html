<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    #coach-subtitle { -webkit-user-select: text; user-select: text; }

    /* Styled runs from the subtitle (SRT <i>/<b> tags, ASS \i/\b overrides). */
    .coach-italic { font-style: italic; }
    .coach-upright { font-style: normal; }
    .coach-bold { font-weight: 700; }
    .coach-regular { font-weight: 400; }
    /* libass slants the upright face itself when the font has no italic face it
       can use (e.g. a font set by its face name such as "Axiforma-Regular"):
       shear about the baseline by the same angle instead of WebKit's italic. */
    .coach-oblique {
      display: inline-block;
      font-style: normal;
      transform: skewX(calc(-1rad * var(--italic-angle, 0)));
      transform-origin: 0 var(--line-baseline, 80%);
    }

    /* Paused-subtitle cue, after React Bits' ShinyText (speed 2.3s, color
       #afb4be, shineColor #fff, spread 120deg): the glyphs turn silver and a
       white shine sweeps across them, always in the same direction. It is drawn on
       a copy of each line laid exactly over it (.coach-shine), so outline and
       layout stay identical to IINA's; the copy is never hit or selected. All
       lines share one gradient sized to the whole subtitle; the sweep is
       driven from script with each copy's own coordinates (see
       startShine), so it crosses the whole subtitle on every pass. */
    .coach-line { position: relative; }
    .coach-shine {
      position: absolute;
      inset: 0;
      white-space: nowrap;
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-text-stroke: 0 transparent;
      text-shadow: none;
      color: transparent;
      background-image: linear-gradient(120deg,
        #afb4be 0%, #afb4be 35%, #ffffff 50%, #afb4be 65%, #afb4be 100%);
      background-repeat: repeat;
      -webkit-background-clip: text;
      background-clip: text;
    }
    .coach-shine * { color: transparent; }
    /* Sheared (synthetic italic) runs are inline blocks, which the line's
       background-clip: text does not reach, so they carry the same gradient
       themselves, positioned in their own coordinates by startShine. */
    .coach-shine .coach-oblique {
      background-image: linear-gradient(120deg,
        #afb4be 0%, #afb4be 35%, #ffffff 50%, #afb4be 65%, #afb4be 100%);
      background-repeat: repeat;
      -webkit-background-clip: text;
      background-clip: text;
    }

    /* Lookup card shown next to the selection. */
    #coach-card {
      position: fixed;
      z-index: 10;
      display: none;
      box-sizing: border-box;
      width: max-content;
      max-width: min(440px, calc(100vw - 24px));
      max-height: min(60vh, 420px);
      overflow-y: auto;
      padding: 10px 14px 11px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 12px;
      background: rgba(28, 28, 30, .94);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .32);
      color: rgba(255, 255, 255, .92);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      text-align: left;
      overflow-wrap: anywhere;
      pointer-events: auto;
      -webkit-user-select: text;
      user-select: text;
    }
    #coach-card[data-visible="true"] { display: block; }
    #coach-card .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
    #coach-card .term { font-weight: 600; color: #fff; }
    #coach-card .quick { color: rgba(255, 255, 255, .78); }
    #coach-card .section { margin-top: 8px; }
    #coach-card .label {
      display: block;
      margin-bottom: 1px;
      color: rgba(175, 180, 190, .95);
      font-size: 11.5px;
      letter-spacing: .04em;
    }
    #coach-card .status { margin-top: 8px; color: rgba(255, 255, 255, .55); font-size: 12.5px; }
    #coach-card .status[data-error="true"] { color: #ffb4ab; }
  </style>
  <style id="subtitle-style"></style>
</head>
<body>
  <div id="coach-wrap"><div id="coach-subtitle" lang="en" data-clickable></div></div>
  <div id="coach-card" data-clickable role="status" aria-live="polite"></div>
  <script>
    // libass sizes a font so that its OS/2 winAscent + winDescent equals the
    // subtitle font size, and puts the baseline winAscent below the line top.
    // WebKit lays text out with CoreText ascent/descent instead. The plugin reads
    // the real metrics from the font; this table and a canvas measurement are
    // fallbacks. Values: [em size / line height, baseline / line height].
    const LIBASS_METRICS = {
      "helvetica": { regular: [0.8509, 0.8085], bold: [0.8390, 0.8054] },
      "sans-serif": { regular: [0.8509, 0.8085], bold: [0.8390, 0.8054] },
      "avenir": { regular: [0.7547, 0.7547], bold: [0.7547, 0.7547] },
      "avenir-roman": { regular: [0.7547, 0.7547], bold: [0.7547, 0.7547] },
      "times": { regular: [0.5883, 0.7481], bold: [0.5883, 0.7481] },
      "palatino": { regular: [0.6038, 0.7084], bold: [0.6038, 0.7084] },
      "hiragino sans": { regular: [0.8104, 0.8104], bold: [0.8104, 0.8104] },
      "courier": { regular: [1.0, 0.7539], bold: [1.0, 0.7539] },
    };
    const measureContext = document.createElement("canvas").getContext("2d");

    // Returns [CSS font size / libass size, libass baseline / line height].
    function libassMetrics(computed, provided) {
      if (Array.isArray(provided) && provided.length === 2 && provided.every(Number.isFinite)) return provided;
      const family = computed.fontFamily.split(",")[0].trim().replace(/^["']|["']$/g, "");
      const known = LIBASS_METRICS[family.toLowerCase()];
      if (known) return known[Number.parseInt(computed.fontWeight, 10) >= 600 ? "bold" : "regular"];
      measureContext.font = `${computed.fontStyle} ${computed.fontWeight} 1000px ${computed.fontFamily}`;
      const metrics = measureContext.measureText("Hg");
      const ascent = (metrics.fontBoundingBoxAscent || 800) / 1000;
      const descent = (metrics.fontBoundingBoxDescent || 200) / 1000;
      return [1 / (ascent + descent), ascent / (ascent + descent)];
    }

    // A subtitle line is a list of words; a word is a list of styled segments
    // { t, i, b } (i/b: true/false when overridden, null for the subtitle style).
    // Each word remembers the style of the space before it (spaceI), since
    // libass's italic spacing rule below depends on where italics really end.
    function wordsOf(runs) {
      const words = [];
      let current = [];
      let spaceI = null;
      for (const run of runs) {
        String(run.t).split(" ").forEach((part, index) => {
          if (index > 0) {
            if (current.length) words.push(current);
            current = [];
            spaceI = run.i;
          }
          if (part) {
            if (!current.length) current.spaceI = spaceI;
            current.push({ t: part, i: run.i, b: run.b });
          }
        });
      }
      if (current.length) words.push(current);
      return words;
    }

    // libass (ass_render.c, "additional space after italic to non-italic style
    // changes"): where italic text is followed by upright text, the last inked
    // italic glyph's advance is extended to its right ink edge. Returns the
    // extra width in CSS pixels for a segment's last character.
    const inkCanvas = document.createElement("canvas");
    const inkContext = inkCanvas.getContext("2d", { willReadFrequently: true });
    let inkFont = null;
    const INK_SCALE = 4;
    function italicOverhang(segment) {
      if (!inkFont || !segment.t) return 0;
      const shear = italicMode.shear;
      const bold = segment.b == null ? inkFont.bold : segment.b;
      const font = `${shear > 0 ? "normal" : "italic"} ${bold ? 700 : 400} ${inkFont.size * INK_SCALE}px ${inkFont.family}`;
      const glyph = segment.t.slice(-1);
      inkContext.font = font;
      const advance = inkContext.measureText(glyph).width;
      // Draw the glyph exactly as it appears (sheared about the baseline for
      // synthetic italics) and find its rightmost inked pixel.
      const size = Math.ceil(inkFont.size * INK_SCALE * 3);
      inkCanvas.width = size;
      inkCanvas.height = size;
      const originX = Math.round(size / 3);
      const baseline = Math.round(size * 2 / 3);
      inkContext.font = font;
      inkContext.fillStyle = "#000";
      inkContext.setTransform(1, 0, -shear, 1, originX, baseline);
      inkContext.fillText(glyph, 0, 0);
      const pixels = inkContext.getImageData(0, 0, size, size).data;
      let right = -Infinity;
      for (let y = 0; y < size; y += 1) {
        for (let x = size - 1; x >= 0 && x > right; x -= 1) {
          if (pixels[(y * size + x) * 4 + 3] > 127) {
            right = x;
            break;
          }
        }
      }
      if (!Number.isFinite(right)) return 0;
      return Math.max(0, (right + 1 - originX - advance) / INK_SCALE);
    }

    // How italics are drawn for the current font: { shear, styleItalic }.
    let italicMode = { shear: 0, styleItalic: false };

    function segmentNode(segment, clickable) {
      const oblique = italicMode.shear > 0 && (segment.i == null ? italicMode.styleItalic : segment.i);
      if (!oblique && segment.i == null && segment.b == null) return document.createTextNode(segment.t);
      const span = document.createElement("span");
      if (oblique) span.classList.add("coach-oblique");
      else if (segment.i != null) span.classList.add(segment.i ? "coach-italic" : "coach-upright");
      if (segment.b != null) span.classList.add(segment.b ? "coach-bold" : "coach-regular");
      // IINA only passes a click through when the element under the pointer has data-clickable.
      if (clickable) span.dataset.clickable = "";
      span.textContent = segment.t;
      return span;
    }

    function wordNodes(words, clickable) {
      const isItalic = (i) => (i == null ? italicMode.styleItalic : i);
      // Flatten to the glyph runs libass sees, in order, with their italic state.
      const items = [];
      words.forEach((word, index) => {
        if (index > 0) items.push({ space: true, italic: isItalic(word.spaceI) });
        for (const segment of word) items.push({ segment, italic: isItalic(segment.i) });
      });
      for (let k = 1; k < items.length; k += 1) {
        if (items[k].italic || !items[k - 1].italic) continue;
        let j = k - 1;
        while (j > 0 && items[j].space && items[j - 1].italic) j -= 1;
        if (!items[j].space) items[j].overhang = italicOverhang(items[j].segment);
      }
      return items.map((item) => {
        if (item.space) return document.createTextNode(" ");
        const node = segmentNode(item.segment, clickable);
        if (!item.overhang) return node;
        const span = node.nodeType === Node.TEXT_NODE ? Object.assign(document.createElement("span"), { textContent: item.segment.t }) : node;
        if (clickable) span.dataset.clickable = "";
        span.style.marginRight = `${item.overhang.toFixed(2)}px`;
        return span;
      });
    }

    function makeLine(words) {
      const line = document.createElement("span");
      line.className = "coach-line";
      line.dataset.clickable = "";
      line.style.whiteSpace = "nowrap";
      line.append(...wordNodes(words, true));
      const shine = document.createElement("span");
      shine.className = "coach-shine";
      shine.setAttribute("aria-hidden", "true");
      shine.append(...wordNodes(words, false));
      line.append(shine);
      return line;
    }

    // Wraps one subtitle line the way libass does for mpv's text subtitles
    // (wrap_lines_smart): break greedily at spaces once a line reaches the
    // available width, then keep moving the last word of a line to the next line
    // while that reduces the difference between the two line widths.
    function libassWrap(words, maxWidth, measure) {
      const lines = [];
      let current = [];
      for (const word of words) {
        const candidate = current.concat([word]);
        if (current.length && measure(candidate) >= maxWidth) {
          lines.push(current);
          current = [word];
        } else {
          current = candidate;
        }
      }
      if (current.length) lines.push(current);
      for (let changed = true; changed;) {
        changed = false;
        for (let i = 0; i + 1 < lines.length; i += 1) {
          if (lines[i].length < 2) continue;
          const before = Math.abs(measure(lines[i]) - measure(lines[i + 1]));
          const upper = lines[i].slice(0, -1);
          const lower = [lines[i][lines[i].length - 1], ...lines[i + 1]];
          // libass compares ink extents; advance widths differ by side bearings, so
          // treat near-ties (such as two lines simply swapping widths) as no gain.
          if (Math.abs(measure(upper) - measure(lower)) < before - 0.5) {
            lines[i] = upper;
            lines[i + 1] = lower;
            changed = true;
          }
        }
      }
      return lines;
    }

    // Lays out every subtitle line as its own block, exactly one libass line tall.
    // (WebKit rounds line-height to whole pixels, so lines wrapped inside a single
    // block would drift from libass's fractional line pitch.)
    function layoutLines(element, sourceLines) {
      element.replaceChildren();
      const maxWidth = element.parentElement.getBoundingClientRect().width;
      const probe = document.createElement("span");
      probe.className = "coach-line";
      probe.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap";
      element.appendChild(probe);
      const widths = new Map();
      const measure = (words) => {
        const key = JSON.stringify(words);
        if (!widths.has(key)) {
          probe.replaceChildren(...wordNodes(words, false));
          widths.set(key, probe.getBoundingClientRect().width);
        }
        return widths.get(key);
      };
      const lines = [];
      for (const runs of sourceLines) {
        const words = wordsOf(runs);
        if (!words.length) lines.push([]);
        else lines.push(...libassWrap(words, maxWidth, measure));
      }
      probe.remove();
      element.replaceChildren(...lines.map(makeLine));
    }

    function applyLibassMetrics(element, sourceLines, fontInfo) {
      const provided = fontInfo && fontInfo.metrics;
      element.style.removeProperty("--baseline-shift");
      element.style.removeProperty("font-style");
      const shear = Number(fontInfo && fontInfo.italicShear) || 0;
      italicMode = {
        shear,
        styleItalic: fontInfo && typeof fontInfo.italic === "boolean"
          ? fontInfo.italic
          : getComputedStyle(element).fontStyle === "italic",
      };
      element.style.setProperty("--italic-angle", Math.atan(shear).toFixed(5));
      // Synthetic italics are drawn by shearing upright glyphs (.coach-oblique).
      if (shear > 0) element.style.fontStyle = "normal";
      const computed = getComputedStyle(element);
      const [emRatio, libassBaseline] = libassMetrics(computed, provided);
      element.style.setProperty("--em-ratio", emRatio.toFixed(5));
      element.style.setProperty("--device-pixel", `${(1 / (window.devicePixelRatio || 1)).toFixed(3)}px`);
      const textStyle = getComputedStyle(element);
      inkFont = {
        size: Number.parseFloat(textStyle.fontSize),
        family: textStyle.fontFamily,
        bold: Number.parseInt(textStyle.fontWeight, 10) >= 600,
      };
      layoutLines(element, sourceLines);
      // Measure where WebKit actually puts the baseline inside one line (it rounds
      // ascent, descent and line-height), then shift glyphs onto libass's baseline.
      const line = element.querySelector(".coach-line");
      if (!line) return;
      const probe = document.createElement("span");
      probe.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
      line.insertBefore(probe, line.firstChild);
      const lineHeight = Number.parseFloat(getComputedStyle(element).lineHeight);
      const cssBaseline = probe.getBoundingClientRect().top - line.getBoundingClientRect().top;
      probe.remove();
      element.style.setProperty("--baseline-shift", `${(lineHeight * libassBaseline - cssBaseline).toFixed(3)}px`);
      element.style.setProperty("--line-baseline", `${cssBaseline.toFixed(3)}px`);
      startShine(element);
    }

    // ShinyText: a gradient twice the subtitle's width moves from 150% to -50%
    // of the subtitle box, so each pass starts beyond the left end, crosses the
    // whole subtitle and leaves beyond the right end, then repeats in the same
    // direction. Every line's copy gets the same sweep in its own coordinates.
    // A pass takes 2.3s / 0.7 (30% slower than ShinyText's 2.3s) for a 600px
    // subtitle and scales with the width, so all lines move at a similar speed.
    // Plain CSS keyframes with literal values are generated for each layout:
    // IINA's overlay runs CSS animations, but not ones whose keyframes use
    // custom properties or Web Animations created from script.
    const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let shineGeneration = 0;

    function startShine(element) {
      const box = element.getBoundingClientRect();
      const duration = Math.max(2, Math.min(5.2, (2.3 / 0.7) * box.width / 600));
      const generation = (shineGeneration += 1);
      const rules = [];
      let index = 0;
      const sweep = (target, offsetX, offsetY) => {
        const y = (box.top - offsetY).toFixed(1);
        const from = (box.left - box.width * 1.5 - offsetX).toFixed(1);
        const to = (box.left + box.width * 0.5 - offsetX).toFixed(1);
        const name = `coach-shine-${generation}-${index}`;
        index += 1;
        target.style.backgroundSize = `${(box.width * 2).toFixed(1)}px ${box.height.toFixed(1)}px`;
        target.style.backgroundPosition = `${from}px ${y}px`;
        rules.push(`@keyframes ${name} { from { background-position: ${from}px ${y}px; } to { background-position: ${to}px ${y}px; } }`);
        if (!reduceMotion) target.style.animation = `${name} ${duration.toFixed(2)}s linear infinite`;
      };
      element.querySelectorAll(".coach-shine").forEach((shine) => {
        const own = shine.getBoundingClientRect();
        sweep(shine, own.left, own.top);
        // offsetLeft/offsetTop ignore the shear, giving each run's unsheared origin.
        shine.querySelectorAll(".coach-oblique").forEach((run) => {
          sweep(run, own.left + run.offsetLeft, own.top + run.offsetTop);
        });
      });
      let sheet = document.getElementById("coach-shine-keyframes");
      if (!sheet) {
        sheet = document.createElement("style");
        sheet.id = "coach-shine-keyframes";
        document.head.appendChild(sheet);
      }
      sheet.textContent = rules.join("\n");
    }

    // The selected subtitle text, without the shine copies and with line breaks
    // turned into spaces.
    function selectedText(range) {
      const fragment = range.cloneContents();
      fragment.querySelectorAll(".coach-shine").forEach((node) => node.remove());
      const lines = fragment.querySelectorAll(".coach-line");
      const text = lines.length
        ? Array.from(lines, (line) => line.textContent).join(" ")
        : fragment.textContent;
      return text.replace(/\s+/g, " ").trim();
    }

    function startCoachOverlay() {
      const subtitle = document.getElementById("coach-subtitle");
      const card = document.getElementById("coach-card");
      let latestRequestID = 0;
      let lastText = "";
      let lastSentAt = 0;
      let lastPoint = null;
      let currentLines = [];
      let currentStyle = { style: "", fontInfo: null };

      function hideCard() {
        card.dataset.visible = "false";
        card.replaceChildren();
      }

      function sendSelection(event) {
        if (event && event.target && !subtitle.contains(event.target)) return;
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed || !selection.rangeCount) return;
        const range = selection.getRangeAt(0);
        const node = range.commonAncestorContainer;
        if (!subtitle.contains(node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement)) return;
        const text = selectedText(range);
        if (!text || text.length > 300) return;
        const now = Date.now();
        if (text === lastText && now - lastSentAt < 500) return;
        const rect = range.getBoundingClientRect();
        lastText = text;
        lastSentAt = now;
        lastPoint = { x: rect.left + rect.width / 2, y: rect.top, bottom: rect.bottom };
        iina.postMessage("translate-selection", { text, point: lastPoint });
      }

      document.addEventListener("mouseup", sendSelection);
      document.addEventListener("keyup", (event) => {
        if (["Shift", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) sendSelection(event);
      });
      subtitle.addEventListener("contextmenu", (event) => {
        const selection = window.getSelection();
        if (selection && !selection.isCollapsed) {
          event.preventDefault();
          sendSelection(event);
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") hideCard();
      });

      function render() {
        document.getElementById("subtitle-style").textContent = currentStyle.style || "";
        applyLibassMetrics(subtitle, currentLines, currentStyle.fontInfo);
      }

      iina.onMessage("render-subtitle", ({ text, lines, style, fontInfo }) => {
        currentLines = Array.isArray(lines) && lines.length
          ? lines
          : String(text || "").split("\n").map((line) => [{ t: line, i: null, b: null }]);
        currentStyle = { style, fontInfo };
        render();
        lastText = "";
        hideCard();
      });
      iina.onMessage("render-style", ({ style, fontInfo }) => {
        currentStyle = { style, fontInfo };
        // Re-laying out the lines invalidates the selection and the card position.
        render();
        window.getSelection()?.removeAllRanges();
        lastText = "";
        hideCard();
      });

      function section(label, text) {
        const block = document.createElement("div");
        block.className = "section";
        const title = document.createElement("span");
        title.className = "label";
        title.textContent = label;
        const body = document.createElement("div");
        body.textContent = text;
        block.append(title, body);
        return block;
      }

      // One lookup card per selection, updated as results arrive:
      // { requestID, point, selection, quick, senses, sentence, meaning, notes, status, hint }.
      iina.onMessage("lookup", (result) => {
        if (!result || result.requestID < latestRequestID) return;
        latestRequestID = result.requestID;
        const head = document.createElement("div");
        head.className = "head";
        const term = document.createElement("span");
        term.className = "term";
        term.lang = "en";
        term.textContent = result.selection || "";
        head.append(term);
        if (result.quick) {
          const quick = document.createElement("span");
          quick.className = "quick";
          quick.textContent = result.quick;
          head.append(quick);
        }
        const parts = [head];
        if (result.meaning) parts.push(section("这里的意思", result.meaning));
        if (Array.isArray(result.senses) && result.senses.length) {
          const senses = result.senses
            .map((sense) => `${sense.pos ? `${sense.pos}：` : ""}${(sense.terms || []).join("、")}`)
            .join("\n");
          const block = section("词典", senses);
          block.lastChild.style.whiteSpace = "pre-line";
          parts.push(block);
        }
        if (result.sentence) parts.push(section("整句", result.sentence));
        if (result.notes) parts.push(section("背景", result.notes));
        const statusText = result.status === "loading"
          ? (result.explaining && result.quick ? "正在结合语境解释…" : "正在翻译…")
          : result.hint || "";
        if (statusText) {
          const status = document.createElement("div");
          status.className = "status";
          status.dataset.error = String(result.status === "error");
          status.textContent = statusText;
          parts.push(status);
        }
        card.replaceChildren(...parts);
        card.dataset.visible = "true";
        placeCard(result.point || lastPoint);
      });

      // Above the selection when there is room, otherwise below it.
      function placeCard(point) {
        const anchor = point || { x: window.innerWidth / 2, y: window.innerHeight * .8 };
        const rect = card.getBoundingClientRect();
        const x = Math.max(12 + rect.width / 2, Math.min(window.innerWidth - 12 - rect.width / 2, anchor.x));
        const above = anchor.y - 10 - rect.height >= 8;
        card.style.left = `${x}px`;
        card.style.top = `${above ? anchor.y - 10 : (anchor.bottom || anchor.y) + 10}px`;
        card.style.transform = above ? "translate(-50%, -100%)" : "translate(-50%, 0)";
      }

      iina.onMessage("clear", () => {
        currentLines = [];
        subtitle.textContent = "";
        window.getSelection()?.removeAllRanges();
        hideCard();
      });
    }

    window.addEventListener("error", (event) => {
      iina.postMessage("overlay-error", { message: String(event.message), line: event.lineno });
    });
    startCoachOverlay();
  </script>
</body>
</html>
